version = 1
SPDX-PackageName = "ocis-workflows"
SPDX-PackageSupplier = "ownCloud GmbH - A Kiteworks Company <ospo@kiteworks.com>"
SPDX-PackageDownloadLocation = "https://github.com/owncloud/ocis-workflows"

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 ownCloud GmbH - A Kiteworks Company and ownCloud contributors"
SPDX-License-Identifier = "Apache-2.0"

# apprise-go (github.com/unraid/apprise-go) and ledongthuc/pdf (github.com/ledongthuc/pdf)
# are Go module dependencies, not vendored into this repo — there's no in-tree file to tag
# their licenses (BSD-2-Clause, BSD-3-Clause) directly. Their license texts are still
# bundled (LICENSES/BSD-2-Clause.txt, LICENSES/BSD-3-Clause.txt) for redistribution
# compliance since both are statically linked into the backend binary; NOTICE.md is the
# file that documents and references them, so it carries the combined identifier to
# satisfy REUSE's "every license text must be used" check.
[[annotations]]
path = "NOTICE.md"
SPDX-FileCopyrightText = [
  "2026 ownCloud GmbH - A Kiteworks Company and ownCloud contributors",
  "2025 Chris Caron",
  "2009 The Go Authors"
]
SPDX-License-Identifier = "Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause"
